name: Cyberpunk System Logs & 3D Matrix

on:
  schedule:
    - cron: "0 0 * * *" # Runs daily at midnight
  workflow_dispatch: # Allows manual trigger from GitHub UI

permissions:
  contents: write

jobs:
  generate-logs-and-3d:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 1. 3D Isometric Matrix
      - name: Generate 3D Contribution Matrix
        uses: yoshi389111/github-profile-3d-contrib@0.7.1
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT }}
          USERNAME: ${{ github.repository_owner }}
          
      # 2. Live System Logs (Terminal)
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Dependencies
        run: pip install requests

      - name: Generate Terminal Logs SVG
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          GITHUB_ACTOR: ${{ github.actor }}
        run: python generate_terminal.py

      - name: Generate Language Distribution SVG
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          GITHUB_ACTOR: ${{ github.actor }}
        run: python generate_languages.py

      # 3. Commit everything
      - name: Commit and Push Changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/terminal.svg
          git add assets/languages.svg
          git add profile-3d-contrib/
          git commit -m "chore: auto-update 3D Matrix, System Logs and Languages [skip ci]" || echo "No changes to commit"
          git push
