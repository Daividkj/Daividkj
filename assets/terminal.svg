<svg width="800" height="300" viewBox="0 0 800 300" xmlns="http://www.w3.org/2000/svg">
    <!-- Terminal Window -->
    <rect width="800" height="300" rx="8" fill="#0A0A0A" stroke="#333333" stroke-width="1"/>
    
    <!-- macOS style top bar -->
    <rect width="800" height="25" rx="8" fill="#1C1C1E" />
    <path d="M 0 25 L 800 25" stroke="#333333" stroke-width="1" />
    <circle cx="15" cy="12.5" r="5.5" fill="#FF5F56" />
    <circle cx="35" cy="12.5" r="5.5" fill="#FFBD2E" />
    <circle cx="55" cy="12.5" r="5.5" fill="#27C93F" />
    
    <!-- Title -->
    <text x="400" y="17" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" fill="#888888" text-anchor="middle" font-weight="500">
        admin@architect-node:~ — bash — 80x24
    </text>

    <!-- Prompt -->
    <text x="15" y="55" font-family="Consolas, 'Courier New', monospace" font-size="13" font-weight="bold">
        <tspan fill="#4AF626">admin@architect-node</tspan><tspan fill="#D4D4D4">:</tspan><tspan fill="#3B8EEA">~</tspan><tspan fill="#D4D4D4">$ ./system_monitor.sh --tail 6</tspan>
    </text>

    <!-- Logs -->
    
    <clipPath id="clipLine0">
        <rect x="15" y="75" width="0" height="20">
            <animate attributeName="width" from="0" to="770" dur="1s" begin="0.0s" fill="freeze" />
        </rect>
    </clipPath>
    <text x="15" y="90" font-family="Consolas, 'Courier New', monospace" font-size="13" fill="#D4D4D4" clip-path="url(#clipLine0)">
        Oct 03 20:29:57 sys init: Arch OS v10.4.1 boot sequence initiated
    </text>
    
    <clipPath id="clipLine1">
        <rect x="15" y="95" width="0" height="20">
            <animate attributeName="width" from="0" to="770" dur="1s" begin="0.4s" fill="freeze" />
        </rect>
    </clipPath>
    <text x="15" y="110" font-family="Consolas, 'Courier New', monospace" font-size="13" fill="#D4D4D4" clip-path="url(#clipLine1)">
        Oct 03 20:29:57 sys network: Secure connection established to GitHub API
    </text>
    
    <clipPath id="clipLine2">
        <rect x="15" y="115" width="0" height="20">
