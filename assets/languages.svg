            <animate attributeName="stroke-dashoffset" from="148.3313103890953" to="0" dur="1s" fill="freeze" begin="0.0s" />
        </circle>
    
        <circle cx="0" cy="0" r="90" fill="none" stroke="#f1e05a" stroke-width="35" 
                stroke-dasharray="142.3231922028123 565.4866776461628" stroke-dashoffset="142.3231922028123" transform="rotate(4.430645054890903)">
            <animate attributeName="stroke-dashoffset" from="142.3231922028123" to="0" dur="1s" fill="freeze" begin="0.2s" />
        </circle>
    
        <circle cx="0" cy="0" r="90" fill="none" stroke="#3178c6" stroke-width="35" 
                stroke-dasharray="136.89745428660984 565.4866776461628" stroke-dashoffset="136.89745428660984" transform="rotate(95.03640327767279)">
            <animate attributeName="stroke-dashoffset" from="136.89745428660984" to="0" dur="1s" fill="freeze" begin="0.4s" />
        </circle>
    
        <circle cx="0" cy="0" r="90" fill="none" stroke="#e34c26" stroke-width="35" 
