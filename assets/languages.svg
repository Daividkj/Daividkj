            <animate attributeName="stroke-dashoffset" from="62.12423481030241" to="0" dur="1s" fill="freeze" begin="0.6000000000000001s" />
        </circle>
    
        <circle cx="0" cy="0" r="90" fill="none" stroke="#663399" stroke-width="35" 
                stroke-dasharray="35.84188542178313 565.4866776461628" stroke-dashoffset="35.84188542178313" transform="rotate(221.73754568676063)">
            <animate attributeName="stroke-dashoffset" from="35.84188542178313" to="0" dur="1s" fill="freeze" begin="0.8s" />
        </circle>
    
        <circle cx="0" cy="0" r="90" fill="none" stroke="#355570" stroke-width="35" 
                stroke-dasharray="31.053617801209487 565.4866776461628" stroke-dashoffset="31.053617801209487" transform="rotate(244.55519862520114)">
            <animate attributeName="stroke-dashoffset" from="31.053617801209487" to="0" dur="1s" fill="freeze" begin="1.0s" />
        </circle>
    
        <!-- Inner glow/decoration -->
        <circle cx="0" cy="0" r="50" fill="#0D1117" stroke="#30363D" stroke-width="2" />
        <text x="0" y="5" font-family="Courier New, monospace" font-size="14" font-weight="bold" fill="#8B949E" text-anchor="middle">CODE</text>
    </g>
<g transform='translate(220, -70)'>
        <circle cx="0" cy="-4" r="5" fill="#3572A5" />
        <text x="15" y="0" font-family="Courier New, monospace" font-size="14" font-weight="bold" fill="#E6EDF3">Python <tspan fill="#3572A5">26.2%</tspan></text>
    
        <circle cx="0" cy="26" r="5" fill="#f1e05a" />
        <text x="15" y="30" font-family="Courier New, monospace" font-size="14" font-weight="bold" fill="#E6EDF3">JavaScript <tspan fill="#f1e05a">25.2%</tspan></text>
    
